[project]
name = "oncall-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arpit Krishna", email = "31812csai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.29.0",
    "pydantic>=2.14.1",
]

[project.scripts]
copilot = "oncall_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
markers = ["llm: calls a real model (slow, needs Ollama running)"]
addopts = "-m 'not llm'"
